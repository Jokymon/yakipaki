name: Build preview APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'preview-*'

permissions:
  contents: read

concurrency:
  group: preview-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-preview-apk:
    name: Validate and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run schema tests
        run: npm run test

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Validate Expo project
        run: npx expo-doctor

      - name: Verify EAS project link
        shell: bash
        run: |
          PROJECT_ID="$(node -e "const c=require('./app.json'); process.stdout.write(c.expo?.extra?.eas?.projectId ?? '')")"
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::EAS project is not linked. Run 'npx eas-cli@latest init', commit the generated extra.eas.projectId, and retry."
            exit 1
          fi

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build signed preview APK
        id: eas-build
        shell: bash
        run: |
          set -euo pipefail
          eas build --platform android --profile preview --non-interactive --wait --json > eas-build.json
          BUILD_URL="$(jq -r '.[0].artifacts.buildUrl // empty' eas-build.json)"
          if [ -z "$BUILD_URL" ]; then
            echo "::error::EAS completed without returning an APK download URL."
            exit 1
          fi
          echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        shell: bash
        env:
          BUILD_URL: ${{ steps.eas-build.outputs.build_url }}
        run: curl --fail --location --retry 3 "$BUILD_URL" --output yakipaki-preview.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yakipaki-preview-${{ github.run_number }}
          path: |
            yakipaki-preview.apk
            eas-build.json
          if-no-files-found: error
          retention-days: 30

      - name: Add build summary
        shell: bash
        run: |
          echo "## Yakipaki preview APK" >> "$GITHUB_STEP_SUMMARY"
          echo "The signed APK is available in the **yakipaki-preview-${{ github.run_number }}** workflow artifact." >> "$GITHUB_STEP_SUMMARY"
          echo "Install it over the previous EAS preview build to retain local app data." >> "$GITHUB_STEP_SUMMARY"
